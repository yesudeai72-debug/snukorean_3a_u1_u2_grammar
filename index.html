<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>서울대 한국어 3A · 1과·2과 문법 연습</title>
  <style>
    :root{--navy:#173c72;--orange:#df8a2d;--cream:#fff9f0;--line:#d7dfeb;--ink:#26364b;--good:#18704e;--bad:#b33c35}*{box-sizing:border-box}body{margin:0;background:#f2f6fb;color:var(--ink);font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}.page{width:min(1040px,calc(100% - 32px));margin:auto;padding:32px 0 56px}header{padding:28px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#16376a,#2864aa);box-shadow:0 12px 32px #173c7230}header p{margin:0 0 8px;font-size:.9rem;font-weight:800;letter-spacing:.08em}h1{margin:0;font-size:clamp(1.65rem,4vw,2.5rem)}.student-box{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0;padding:20px;border:1px solid var(--line);border-radius:16px;background:#fff}label{display:grid;gap:7px;font-weight:800}input{width:100%;padding:12px 14px;border:1px solid #b9c7d9;border-radius:9px;font:inherit}input:focus{outline:3px solid #2d69b633;border-color:#2d69b6}.unit-title{margin:38px 0 16px;padding:14px 18px;border-radius:12px;color:#fff;background:linear-gradient(90deg,#d77b26,#f1ad52);font-size:1.35rem;font-weight:900}.grammar-note{margin:0 0 18px;color:#526178;font-size:.96rem}.practice{margin:18px 0;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 7px 22px #173c720d}.practice-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;background:var(--cream);border-bottom:1px solid #f1dfc5}.practice-head h2{margin:0;font-size:1.15rem}.grammar-chip{padding:6px 10px;border-radius:999px;color:#82460e;background:#ffe2bd;font-weight:800;font-size:.86rem}.example{margin:18px 20px 4px;padding:14px 16px;border-left:4px solid var(--orange);border-radius:0 10px 10px 0;background:#fffaf4;line-height:1.7;font-size:.96rem}.questions{padding:8px 20px 20px}.question{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:15px 0;border-bottom:1px dashed #d9e0ea}.question:last-child{border-bottom:0}.number{padding-top:11px;color:#65809e;font-weight:900}.prompt{margin:0 0 9px;line-height:1.6;font-size:1.03rem}.cue{display:inline-block;margin-bottom:8px;padding:3px 8px;border-radius:6px;color:#895319;background:#fff3e1;font-size:.9rem;font-weight:700}.answer-input{border-radius:7px;border-width:0 0 2px;border-color:#7f98b9;background:#f7faff}.answer-input.correct{background:#eaf8f1;border-color:var(--good);color:#116343}.answer-input.incorrect{background:#fff1ef;border-color:var(--bad);color:#9d2923}.practice-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-top:1px solid var(--line);background:#fbfcfe}.result{font-size:.93rem;font-weight:800}button{border:0;border-radius:9px;padding:11px 15px;background:var(--navy);color:#fff;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.submit-area{margin-top:28px;padding:24px;border-radius:16px;background:#173c72;color:#fff}.submit-area h2{margin:0 0 8px}.submit-area p{margin:0 0 16px;line-height:1.6;color:#dce9fb}.submit-area button{background:#f1aa50;color:#53300b}.message{display:none;margin-top:16px;padding:13px;border-radius:9px;background:#eaf8f1;color:#126141;font-weight:800}.message.error{background:#fff0ef;color:#9c302a}footer{text-align:center;color:#75849a;font-size:.82rem;margin-top:28px}@media(max-width:640px){.page{width:min(100% - 22px,1040px);padding-top:16px}.student-box{grid-template-columns:1fr}.practice-head,.practice-footer{align-items:flex-start;flex-direction:column}.questions{padding-inline:14px}.example{margin-inline:14px}}
  </style>
</head>
<body>
<main class="page">
  <header><p>SEOUL NATIONAL UNIVERSITY KOREAN 3A</p><h1>1과·2과 문법 연습</h1></header>
  <section class="student-box"><label>학번(번호)<input id="studentId" placeholder="예: 20260001"></label><label>이름<input id="studentName" placeholder="예: 김한국"></label></section>
  <div id="app"></div>
  <section class="submit-area"><h2>최종 제출</h2><p>모든 연습의 빈칸을 작성하고 각 연습의 정답 확인을 마친 뒤 제출할 수 있습니다.</p><button id="finalSubmit" disabled>전체 결과 제출하기</button><div id="message" class="message"></div></section>
  <footer>서울대학교 한국어 3A · 1과·2과 문법 연습</footer>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getFirestore,collection,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDhggUZfNi6POHz1qdfLoilKfEaqgWhdyo",authDomain:"learning-korean-with-ai.firebaseapp.com",projectId:"learning-korean-with-ai",storageBucket:"learning-korean-with-ai.appspot.com",messagingSenderId:"910630520783",appId:"1:910630520783:web:0cf02dbeadff7ae46be48e"};
const db=getFirestore(initializeApp(firebaseConfig)),collectionName="snukorean_3a_u1_u2_grammar";
const practices=[
["1과","연습 1","-다고 하다","선생님: 그 사람은 주말마다 영화를 봐요.<br>학생: 그 사람은 주말마다 영화를 본다고 했어요.",[["민수 씨는 노래를 잘 불러요.","","민수 씨는 노래를 잘 부른다고 했어요."],["카렌 씨는 음식을 맛있게 만들어요.","","카렌 씨는 음식을 맛있게 만든다고 했어요."],["사진 두 장이 필요해요.","","사진 두 장이 필요하다고 했어요."],["‘친구’라는 영화가 재미있어요.","","‘친구’라는 영화가 재미있다고 했어요."]]],
["1과","연습 2","-아/어야겠다","선생님: 다음 주에 중요한 시험이 있지요?<br>학생: 네, 열심히 공부해야겠어요.",[["내일이 수진 씨 생일이지요?","(파티 준비를 하다) 네,","파티 준비를 해야겠어요."],["방학 때 고향에 가지요?","(비행기 표를 예약하다) 네,","비행기 표를 예약해야겠어요."],["머리가 너무 기네요.","(자르다) 네,","잘라야겠어요."],["민호 씨가 아직도 안 왔네요.","(연락해 보다) 네,","연락해 봐야겠어요."]]],
["1과","연습 3","-다고 들었다","선생님: 어느 시장이 물건값이 싼지 아세요?<br>학생: 남대문시장이 싸다고 들었어요.",[["지금 고향 날씨가 어떤지 아세요?","(춥다)","춥다고 들었어요."],["마이클 씨가 어디에 사는지 아세요?","(독일)","독일에 산다고 들었어요."],["밍밍 씨가 뭘 잘 먹는지 아세요?","(비빔밥)","비빔밥을 잘 먹는다고 들었어요."],["회의가 몇 시인지 아세요?","(4시)","4시라고 들었어요."]]],
["1과","연습 4","-네요 / -래요","선생님: 오늘 날씨가 따뜻해요?<br>학생: 네, 따뜻하대요.",[["그 수업이 인기가 많아요?","","네, 인기가 많대요."],["민수 씨도 졸업식에 참석해요?","","네, 참석한대요."],["바바라 씨도 매운 음식을 잘 먹어요?","","네, 매운 음식을 잘 먹는대요."],["지현 씨 언니가 한국어 선생님이에요?","","네, 한국어 선생님이래요."]]],
["2과","연습 1","-자마자","선생님: 언제 밥을 먹을까요?<br>학생: 수업이 끝나자마자 먹어요.",[["언제 차를 마실까요?","(식사를 마치다)","식사를 마치자마자 차를 마셔요."],["언제 여행 갈까요?","(방학하다)","방학하자마자 여행 가요."],["언제 회의를 시작할까요?","(사장님이 오시다)","사장님이 오시자마자 회의를 시작해요."],["언제 동아리 모임을 할까요?","(중간시험이 끝나다)","중간시험이 끝나자마자 동아리 모임을 해요."]]],
["2과","연습 2","-라고 하다","선생님: 일찍 일어나세요.<br>학생: 일찍 일어나라고 했어요.",[["책을 읽으세요.","","책을 읽으라고 했어요."],["늦게 오지 마세요.","","늦게 오지 말라고 했어요."],["펜 좀 빌려주세요.","","펜 좀 빌려 달라고 했어요."],["이 서류를 민수 씨에게 전해 주세요.","","이 서류를 민수 씨에게 전해 주라고 했어요."]]],
["2과","연습 3","-느라고","선생님: 아직도 저녁을 못 먹었어요?<br>학생: 네, 일하느라고 못 먹었어요.",[["아직 집에 안 갔어요?","(회의 준비하다) 네,","회의 준비하느라고 못 갔어요."],["요즘 많이 힘들지?","(공부하다) 네,","공부하느라고 힘들어요."],["요즘도 많이 바빠요?","(면접 준비하다) 네,","면접 준비하느라고 바빠요."],["정우야, 늦었구나.","(친구 만나고 오다) 네,","친구 만나고 오느라고 늦었어요."]]],
["2과","연습 4","-나 / -이나","선생님: 학생들이 모두 열심히 공부해요?<br>학생: 네, 우리 학교 학생은 누구나 열심히 공부해요.",[["오늘도 마리코 씨가 제일 일찍 왔어요?","(마리코 씨 / 언제나)","네, 마리코 씨는 언제나 제일 일찍 와요."],["이 식당 음식이 맛있어요?","(이 식당 음식 / 무엇이나)","네, 이 식당 음식은 무엇이나 맛있어요."],["동대문시장에도 사람이 많아요?","(시장 / 어디나)","네, 시장은 어디나 사람이 많아요."],["그 아이가 컴퓨터 게임을 좋아해요?","(요즘 아이들 / 누구나)","네, 요즘 아이들은 누구나 컴퓨터 게임을 좋아해요."]]]
];
const state={checked:Array(8).fill(false),scores:Array(8).fill(0)};
const norm=t=>t.replace(/[\s.,!?'"“”‘’·]/g,"").trim();
const info=()=>({studentId:document.querySelector("#studentId").value.trim(),studentName:document.querySelector("#studentName").value.trim()});
const ready=()=>info().studentId&&info().studentName;
function note(text,error=false){const m=document.querySelector("#message");m.textContent=text;m.className="message"+(error?" error":"");m.style.display="block"}
function render(){const app=document.querySelector("#app");let unit="";practices.forEach(([u,title,grammar,example,items],p)=>{if(unit!==u){unit=u;app.insertAdjacentHTML("beforeend",`<h2 class="unit-title">${u} 문법 연습</h2><p class="grammar-note">각 연습의 네 문항을 모두 작성하면 정답을 확인할 수 있습니다.</p>`)}let q=items.map(([prompt,cue],i)=>`<div class="question"><div class="number">${i+1}.</div><div><p class="prompt">T &nbsp; ${prompt}</p>${cue?`<span class="cue">${cue}</span>`:""}<input class="answer-input" data-p="${p}" data-i="${i}" placeholder="답을 입력하세요."></div></div>`).join("");app.insertAdjacentHTML("beforeend",`<section class="practice"><div class="practice-head"><h2>${title}</h2><span class="grammar-chip">${grammar}</span></div><div class="example"><strong>[보기]</strong><br>${example}</div><div class="questions">${q}</div><div class="practice-footer"><span class="result" id="r${p}">네 문항을 모두 작성한 뒤 확인하세요.</span><button data-check="${p}">${title} 정답 확인</button></div></section>`)});document.querySelectorAll("[data-check]").forEach(b=>b.onclick=()=>grade(+b.dataset.check));document.querySelector("#finalSubmit").onclick=submit}
async function save(data){await addDoc(collection(db,collectionName),{...data,submittedAt:serverTimestamp(),submittedAtLocal:new Date().toLocaleString("ko-KR")})}
async function grade(p){if(!ready())return alert("학번(번호)과 이름을 먼저 입력하세요.");let [unit,title,grammar,,items]=practices[p],inputs=[...document.querySelectorAll(`[data-p="${p}"]`)];if(inputs.some(x=>!x.value.trim()))return alert(`${title}의 네 문항을 모두 작성해야 합니다.`);let score=0,answers=inputs.map((x,i)=>{let correct=items[i][2],ok=norm(x.value)===norm(correct);x.className="answer-input "+(ok?"correct":"incorrect");if(ok)score++;return{question:items[i][0],cue:items[i][1],studentAnswer:x.value.trim(),correctAnswer:correct,isCorrect:ok}});state.checked[p]=true;state.scores[p]=score;document.querySelector("#r"+p).textContent=`${title}: ${score} / 4점`;try{await save({eventType:"practice_check",...info(),unit,practice:title,grammar,score,total:4,answers});note(`${title} 채점 결과가 저장되었습니다.`)}catch(e){console.error(e);note("채점은 되었지만 Firestore 저장에 실패했습니다. 규칙을 확인하세요.",true)}document.querySelector("#finalSubmit").disabled=!state.checked.every(Boolean)}
async function submit(){if(!ready())return alert("학번(번호)과 이름을 먼저 입력하세요.");if(!state.checked.every(Boolean))return alert("모든 연습의 정답 확인을 먼저 완료하세요.");let totalScore=state.scores.reduce((a,b)=>a+b,0);try{await save({eventType:"final_submit",...info(),totalScore,total:32,practiceScores:state.scores});note(`최종 제출 완료: ${totalScore} / 32점`)}catch(e){console.error(e);note("최종 결과 저장에 실패했습니다. Firestore 규칙을 확인하세요.",true)}}
render();
</script>
</body></html>
